[versions]
micronaut = "5.0.0-RC2"
micronaut-platform = "5.0.0-M3"
micronaut-test = "5.0.0-M8"
micronaut-gradle-plugin = "5.0.0-M1"

awaitility = '4.3.0'
jsr305 = "3.0.2"
managed-amqp-client = '5.30.0'
micronaut-micrometer = "6.0.1-M1"
micronaut-serde = "3.0.0-RC2"
micronaut-cache = "6.0.0-M3"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
managed-amqp-client = { module = 'com.rabbitmq:amqp-client', version.ref = 'managed-amqp-client' }
awaitility = { module = 'org.awaitility:awaitility', version.ref = 'awaitility' }
jsr305 = {group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }
micronaut-micrometer = { module = "io.micronaut.micrometer:micronaut-micrometer-bom", version.ref = "micronaut-micrometer" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-cache = { module = "io.micronaut.cache:micronaut-cache-bom", version.ref = "micronaut-cache" }
gradle-micronaut = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }
